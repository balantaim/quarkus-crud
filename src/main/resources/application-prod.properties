#JWT secrets as variable
smallrye.jwt.sign.key=${JWT_PRIVATE_KEY}
mp.jwt.verify.publickey=${JWT_PUBLIC_KEY}

# Open API
quarkus.smallrye-openapi.enabled=false
quarkus.swagger-ui.always-include=false

# Allowed origin (Mandatory for production)
quarkus.http.cors.origins=https://management-system-spring-cloud.vercel.app

# Record start request timestamp
quarkus.http.record-request-start-time=false