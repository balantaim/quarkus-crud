# Open API
quarkus.smallrye-openapi.enabled=true
quarkus.smallrye-openapi.path=/openapi
mp.openapi.extensions.smallrye.info.title=Swagger
mp.openapi.extensions.smallrye.info.version=1.0.0
mp.openapi.extensions.smallrye.info.description=API documentation for CRUD application

# Disable in order to access BootUI in 'dev' mode
quarkus.security.jaxrs.deny-unannotated-endpoints=false

quarkus.log.console.json=true