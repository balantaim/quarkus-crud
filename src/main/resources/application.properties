quarkus.http.port=5000

# Open API
quarkus.smallrye-openapi.enabled=true
quarkus.smallrye-openapi.path=/openapi
mp.openapi.extensions.smallrye.info.title=Swagger
mp.openapi.extensions.smallrye.info.version=1.0.0
mp.openapi.extensions.smallrye.info.description=API documentation for CRUD application

# Flyway
quarkus.flyway.migrate-at-start=true
#quarkus.flyway.schemas=public
quarkus.flyway.locations=classpath:db/migration
#quarkus.flyway.locations=classpath:db/migration/{vendor}

# Datasource: 'test' profile (Argument: -Dquarkus.profile=test)
%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=sa

# Datasource: 'prod' profile (Argument: -Dquarkus.profile=prod)
%prod.quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5433/users
%prod.quarkus.datasource.username=sa
%prod.quarkus.datasource.password=sa

#quarkus.hibernate-orm.schema-management.strategy=drop-and-create
quarkus.hibernate-orm.schema-management.strategy=validate
#quarkus.hibernate-orm.sql-load-script=h2/import.sql

#smallrye.jwt.sign.key.location=privateKey.pem
#mp.jwt.verify.publickey.location=publicKey.pem