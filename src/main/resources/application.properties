quarkus.http.port=5000

quarkus.log.level=INFO
quarkus.log.category."com.martinatanasov".level=INFO

# Flyway
quarkus.flyway.migrate-at-start=false
#quarkus.flyway.schemas=public
quarkus.flyway.locations=classpath:db/migration
#quarkus.flyway.locations=classpath:db/migration/{vendor}

# Datasource: 'prod' (Default profile when no profile specified)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5433/users
quarkus.datasource.username=sa
quarkus.datasource.password=sa

# Datasource: 'dev' profile (Argument: -Dquarkus.profile=dev)
%dev.quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5433/users
%dev.quarkus.datasource.username=sa
%dev.quarkus.datasource.password=sa

# Datasource: 'unittest' profile (Argument: -Dquarkus.profile=unittest)
%unittest.quarkus.datasource.db-kind=h2
%unittest.quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
%unittest.quarkus.datasource.username=sa
%unittest.quarkus.datasource.password=sa

quarkus.hibernate-orm.schema-management.strategy=validate
#quarkus.hibernate-orm.sql-load-script=h2/import.sql

# Required for building native image via GraalVM (this is specific for password4j dependency)
quarkus.native.additional-build-args=--initialize-at-run-time=com.password4j.AlgorithmFinder

#smallrye.jwt.sign.key.location=privateKey.pem
#mp.jwt.verify.publickey.location=publicKey.pem

# Quarkus has three profiles by default: dev (for development), test (running on 8081), prod (default)