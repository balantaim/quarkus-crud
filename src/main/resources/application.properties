quarkus.http.port=5000

quarkus.log.level=INFO
quarkus.log.category."com.martinatanasov".level=INFO

# Flyway
quarkus.flyway.migrate-at-start=false
#quarkus.flyway.schemas=public
quarkus.flyway.locations=classpath:db/migration
#quarkus.flyway.locations=classpath:db/migration/{vendor}

# Datasource: 'prod' (Default profile when no profile specified)
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5433/users
quarkus.datasource.username=sa
quarkus.datasource.password=sa

# Datasource: 'dev' profile (Argument: -Dquarkus.profile=dev)
%dev.quarkus.datasource.db-kind=postgresql
%dev.quarkus.datasource.jdbc.url=jdbc:postgresql://localhost:5433/users
%dev.quarkus.datasource.username=sa
%dev.quarkus.datasource.password=sa

# Datasource: 'unittest' profile (Argument: -Dquarkus.profile=unittest)
%unittest.quarkus.datasource.db-kind=h2
%unittest.quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
%unittest.quarkus.datasource.username=sa
%unittest.quarkus.datasource.password=sa

quarkus.hibernate-orm.schema-management.strategy=validate
quarkus.hibernate-orm.jdbc.timezone=UTC
#quarkus.hibernate-orm.sql-load-script=h2/import.sql

# Required for building native image via GraalVM (this is specific for password4j dependency)
quarkus.native.additional-build-args=--initialize-at-run-time=com.password4j.AlgorithmFinder

# native image: bundle the key files
quarkus.native.resources.includes=public.pem,private.pem

# Secure all endpoint by default (Default false)
quarkus.security.jaxrs.deny-unannotated-endpoints=true

# JWT
smallrye.jwt.sign.key.location=private.pem
mp.jwt.verify.publickey.location=public.pem
mp.jwt.verify.issuer=Management system
# Allow only JWT with specific audience
mp.jwt.verify.audiences=access
# Define Quarkus roles in the JWT
smallrye.jwt.path.groups=authorities
# Access Token expiration: 1 hour
token.access-expiration=3600000
# Refresh Token expiration: 30 days
token.refresh-expiration=2592000000

# CORS
quarkus.http.cors.enabled=true
quarkus.http.cors.exposed-headers=User-Id
quarkus.http.cors.headers=Authorization,Content-Type,Client-Platform-Id
quarkus.http.cors.methods=GET,POST,PUT,DELETE
quarkus.http.cors.access-control-max-age=1H

# Headers (Only for HTML pages, do NOT use for JSON)
#quarkus.http.header."Strict-Transport-Security".value=max-age=31536000; includeSubDomains
#quarkus.http.header."X-Content-Type-Options".value=nosniff
#quarkus.http.header."X-Frame-Options".value=DENY
#quarkus.http.header."Referrer-Policy".value=no-referrer
#quarkus.http.header."Cache-Control".value=no-store
#quarkus.http.header."Cache-Control".path=/api/*
#quarkus.http.header."Content-Security-Policy".value=default-src 'none'; frame-ancestors 'none'

# Request limits
quarkus.http.limits.max-body-size=1M
quarkus.http.limits.max-header-size=16K
quarkus.http.limits.max-form-attribute-size=2K
quarkus.http.idle-timeout=30S
quarkus.http.read-timeout=30S

# Quarkus has three profiles by default: dev (for development), test (running on 8081), prod (default if no profile specified)